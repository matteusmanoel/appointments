name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    # Postgres descartável (sem secrets) só para validar que as migrations aplicam do zero e são idempotentes.
    # Imagem com pgvector: as migrations de conhecimento/embeddings fazem CREATE EXTENSION vector (postgres:16 puro não tem).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Backend — install & test
        run: |
          cd backend
          npm ci
          npm test

      - name: Backend — migrations (banco descartável, 2x para checar idempotência)
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: |
          cd backend
          npm run migrate:all
          npm run migrate:all

      - name: Backend — build (TypeScript)
        run: |
          cd backend
          npm run build

      - name: Backend — benchmark mock (AI gate)
        run: |
          cd backend
          npm run benchmark:run:mock
        continue-on-error: true

      - name: Frontend — install & build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.navalhia.com.br' }}
        run: |
          npm ci
          npm run build
