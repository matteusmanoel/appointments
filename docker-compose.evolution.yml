# Evolution API v2.3.7 — stack isolado (postgres/redis só da Evolution).
# Uso (um único .env na raiz do repo):
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.evolution.yml up -d
#
# A API NavalhIA continua no Postgres do docker-compose.yml.
# Um servidor Evolution, N instâncias (uma por barbearia).
# Evolution alcança a API pelo hostname `api` na rede default.

services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - navalhia-evolution
    environment:
      EVOLUTION_API_URL: http://navalhia-evolution-api:8080
      EVOLUTION_WEBHOOK_PUBLIC_URL: http://api:3000/api/webhooks/evolution

  worker-ai:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - navalhia-evolution
    environment:
      EVOLUTION_API_URL: http://navalhia-evolution-api:8080

  worker-scheduled:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - navalhia-evolution
    environment:
      EVOLUTION_API_URL: http://navalhia-evolution-api:8080

  navalhia-evolution-postgres:
    image: postgres:15-alpine
    container_name: navalhia-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?set EVOLUTION_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - navalhia_evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - navalhia-evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d ${EVOLUTION_POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 10

  navalhia-evolution-redis:
    image: redis:7-alpine
    container_name: navalhia-evolution-redis
    restart: unless-stopped
    command: redis-server --requirepass ${EVOLUTION_REDIS_PASSWORD:?set EVOLUTION_REDIS_PASSWORD in .env}
    volumes:
      - navalhia_evolution_redis_data:/data
    networks:
      - navalhia-evolution
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${EVOLUTION_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  navalhia-evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: navalhia-evolution-api
    restart: unless-stopped
    depends_on:
      navalhia-evolution-postgres:
        condition: service_healthy
      navalhia-evolution-redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@navalhia-evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: navalhia_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD}@navalhia-evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: navalhia
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      S3_ENABLED: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: ${CONFIG_SESSION_PHONE_CLIENT:-Chrome}
      CONFIG_SESSION_PHONE_NAME: ${CONFIG_SESSION_PHONE_NAME:-Chrome}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:3000/api/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
    volumes:
      - navalhia_evolution_instances:/evolution/instances
    networks:
      - navalhia-evolution
      - default

networks:
  navalhia-evolution:
    name: navalhia-evolution-net
  default:

volumes:
  navalhia_evolution_postgres_data:
  navalhia_evolution_redis_data:
  navalhia_evolution_instances:
